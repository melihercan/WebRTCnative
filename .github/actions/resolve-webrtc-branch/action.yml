name: Resolve WebRTC branch
description: >-
  Decide which WebRTC branch-head to build. With no inputs it asks the Chromium
  dashboard for the newest milestone that has actually reached stable and returns
  that milestone's WebRTC branch. A branch number or a milestone may be given to
  override the lookup. The result is checked against the real WebRTC repository
  before it is returned, so a bad value fails in seconds rather than an hour into
  a checkout that was never going to work.

inputs:
  webrtc_branch:
    description: 'WebRTC branch-head number, e.g. 7977. Takes priority over chromium_milestone.'
    required: false
    default: ''
  chromium_milestone:
    description: 'Chromium milestone, e.g. 152. Used only when webrtc_branch is empty.'
    required: false
    default: ''

outputs:
  branch:
    description: 'WebRTC branch-head number to check out, e.g. 7977.'
    value: ${{ steps.resolve.outputs.branch }}
  milestone:
    description: 'Chromium milestone the branch belongs to, or "unknown".'
    value: ${{ steps.resolve.outputs.milestone }}
  source:
    description: 'How the branch was arrived at, for logs and the job summary.'
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: composite
  steps:
    # bash exists on the Windows runners too (Git Bash), and every runner image
    # ships Python, so one step covers ubuntu / macos / windows.
    - id: resolve
      shell: bash
      # The inputs go through the environment rather than being interpolated
      # into the script text, so nothing in them can be read as shell syntax.
      env:
        IN_BRANCH: ${{ inputs.webrtc_branch }}
        IN_MILESTONE: ${{ inputs.chromium_milestone }}
        SCRIPT_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python_bin=''
        for candidate in python3 python; do
          if command -v "$candidate" >/dev/null 2>&1; then python_bin="$candidate"; break; fi
        done
        if [ -z "$python_bin" ]; then
          echo "::error::No Python interpreter on PATH; cannot resolve the WebRTC branch."
          exit 1
        fi
        "$python_bin" "${SCRIPT_DIR}/resolve_webrtc_branch.py" \
          --branch    "${IN_BRANCH:-}" \
          --milestone "${IN_MILESTONE:-}"
