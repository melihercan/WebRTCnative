# Builds the WebRTC Android archive (libwebrtc.aar) for the MAUI Android bindings.
#
# Android does not use the shared-library patch: build_aar.py already produces a
# .aar containing the JNI shared objects and the Java API. It does need a patch of
# its own, though -- see the "Patch the AAR's class list" step.

name: WebRtcNativeAndroidLib

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: 'WebRTC branch-head to build, e.g. 7977. Leave empty for the latest stable Chromium milestone.'
        required: false
        default: ''
      arch:
        description: 'ABIs to include, space separated. Empty builds every ABI build_aar.py supports.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Resolve WebRTC branch
        id: webrtc
        uses: ./.github/actions/resolve-webrtc-branch
        with:
          webrtc_branch: ${{ inputs.webrtc_branch }}

      - name: Free disk space
        run: |
          # An Android WebRTC checkout plus the AAR build fills the runner disk
          # unless the preinstalled toolchains are removed first.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean || true
          df -h /

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          # depot_tools must come first so its python and git win over the runner's.
          echo "${GITHUB_WORKSPACE}/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap gclient
        run: gclient

      - name: Configure Git
        run: |
          # gclient refuses to run without an identity; this is not a commit author.
          git config --global user.name  'github-actions'
          git config --global user.email 'github-actions@users.noreply.github.com'
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always

      - name: Fetch WebRTC source
        env:
          BRANCH: ${{ steps.webrtc.outputs.branch }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/webrtc-checkout"
          cd "$HOME/webrtc-checkout"
          # webrtc_android pulls the Android SDK/NDK that build_aar.py needs.
          fetch --nohooks webrtc_android
          cd src
          git fetch origin "+refs/branch-heads/${BRANCH}:refs/remotes/branch-heads/${BRANCH}"
          git checkout -B "webrtc-${BRANCH}" "refs/remotes/branch-heads/${BRANCH}"
          gclient sync -D --force --reset
          # The deps script arrives with the gclient-pulled build/ directory and
          # has changed name across branches, so probe for it.
          if   [ -f build/install-build-deps.py ]; then python3 build/install-build-deps.py --no-prompt --android || true
          elif [ -f build/install-build-deps.sh ]; then ./build/install-build-deps.sh --no-prompt --android || true
          fi
          git log -1 --oneline

      - name: Patch the AAR's class list
        run: |
          set -euxo pipefail
          # dist_jar("libwebrtc") merges only the jars of the targets it lists, and
          # jni_zero generates the JNI glue into separate targets it does not.
          # Without this the AAR ships PeerConnectionFactory but not
          # PeerConnectionFactoryJni, and initialize() throws NoClassDefFoundError
          # on the first line an app runs. The script asserts its anchors and is
          # idempotent; if an assertion fires, update the script, do not skip it.
          python3 "$GITHUB_WORKSPACE/tools/add_generated_jni_to_aar.py"             "$HOME/webrtc-checkout/src/sdk/android/BUILD.gn"

      - name: Build the AAR
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euxo pipefail
          cd "$HOME/webrtc-checkout/src"

          # Two things here are load-bearing.
          #
          # --build-dir is passed so the next step can find the generated
          # GEN_JNI.java; left alone, build_aar.py uses a temporary directory.
          #
          # The gn args turn jni_zero multiplexing off. build_aar.py builds
          # release and non-component, which switches it on, and in that mode the
          # JNI registry ships as J/N with a forwarding GEN_JNI that the APK-time
          # optimiser is expected to inline away. That step never happens for a
          # consumed AAR, so the archive ends up with J/N while the generated
          # *Jni classes call a GEN_JNI that is not there. With multiplexing off,
          # jni_registration_generator writes one real GEN_JNI instead.
          if [ -n "${ARCH// /}" ]; then
            # shellcheck disable=SC2086
            ./tools_webrtc/android/build_aar.py --output ./libwebrtc.aar               --build-dir ./out_aar --arch $ARCH               --extra-gn-args enable_jni_multiplexing=false use_hashed_jni_names=false
          else
            ./tools_webrtc/android/build_aar.py --output ./libwebrtc.aar               --build-dir ./out_aar               --extra-gn-args enable_jni_multiplexing=false use_hashed_jni_names=false
          fi

      - name: Put GEN_JNI into the archive
        run: |
          set -euxo pipefail
          cd "$HOME/webrtc-checkout/src"
          # The registration library's javac jar is empty, so dist_jar merges
          # nothing and GEN_JNI never reaches classes.jar. See the script.
          python3 "$GITHUB_WORKSPACE/tools/inject_gen_jni.py"             --aar ./libwebrtc.aar --build-dir ./out_aar --src-root .

      - name: Collect libwebrtc.aar
        run: |
          set -euo pipefail
          aar="$HOME/webrtc-checkout/src/libwebrtc.aar"
          if [ ! -f "$aar" ]; then echo "::error::libwebrtc.aar was not produced by the build."; exit 1; fi
          ls -lh "$aar"
          # Record the ABIs actually packaged, so consumers can check at a glance.
          unzip -l "$aar" | grep -E '\.so$' || true

          # An AAR missing the generated JNI classes builds, packages and uploads
          # without complaint, then throws NoClassDefFoundError on the first line
          # an app runs. Check the classes are in there before calling it an
          # artifact. Both halves matter: the generated *Jni classes, and the
          # GEN_JNI registry every one of them calls into. An archive with the
          # first and not the second crashes just as surely, one class later.
          python3 - "$aar" <<'PY'
          import io, sys, zipfile
          aar = zipfile.ZipFile(sys.argv[1])
          classes = zipfile.ZipFile(io.BytesIO(aar.read('classes.jar'))).namelist()
          jni = [c for c in classes if c.endswith('Jni.class')]
          print('classes.jar: %d classes, %d generated JNI' % (len(classes), len(jni)))
          missing = [n for n in ('org/webrtc/PeerConnectionFactoryJni.class',
                                 'org/jni_zero/GEN_JNI.class') if n not in classes]
          if missing:
              sys.exit('::error::classes.jar is missing %s; the generated JNI patch did not '
                       'take and this AAR would crash on startup.' % ', '.join(missing))
          PY

          cp "$aar" "$GITHUB_WORKSPACE/libwebrtc.aar"

      - name: Upload libwebrtc.aar
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-android-m${{ steps.webrtc.outputs.milestone }}-${{ steps.webrtc.outputs.branch }}
          path: libwebrtc.aar
          if-no-files-found: error
          retention-days: 30
