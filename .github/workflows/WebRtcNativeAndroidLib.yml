# Builds the WebRTC Android archive (libwebrtc.aar) for the MAUI Android bindings.
#
# Android does not use the shared-library patch: build_aar.py already produces a
# .aar containing the JNI shared objects and the Java API.

name: WebRtcNativeAndroidLib

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: 'WebRTC branch-head to build, e.g. 7977. Leave empty for the latest stable Chromium milestone.'
        required: false
        default: ''
      arch:
        description: 'ABIs to include, space separated. Empty builds every ABI build_aar.py supports.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Resolve WebRTC branch
        id: webrtc
        uses: ./.github/actions/resolve-webrtc-branch
        with:
          webrtc_branch: ${{ inputs.webrtc_branch }}

      - name: Free disk space
        run: |
          # An Android WebRTC checkout plus the AAR build fills the runner disk
          # unless the preinstalled toolchains are removed first.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo apt-get clean || true
          df -h /

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          # depot_tools must come first so its python and git win over the runner's.
          echo "${GITHUB_WORKSPACE}/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap gclient
        run: gclient

      - name: Configure Git
        run: |
          # gclient refuses to run without an identity; this is not a commit author.
          git config --global user.name  'github-actions'
          git config --global user.email 'github-actions@users.noreply.github.com'
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always

      - name: Fetch WebRTC source
        env:
          BRANCH: ${{ steps.webrtc.outputs.branch }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/webrtc-checkout"
          cd "$HOME/webrtc-checkout"
          # webrtc_android pulls the Android SDK/NDK that build_aar.py needs.
          fetch --nohooks webrtc_android
          cd src
          git fetch origin "+refs/branch-heads/${BRANCH}:refs/remotes/branch-heads/${BRANCH}"
          git checkout -B "webrtc-${BRANCH}" "refs/remotes/branch-heads/${BRANCH}"
          gclient sync -D --force --reset
          # The deps script arrives with the gclient-pulled build/ directory and
          # has changed name across branches, so probe for it.
          if   [ -f build/install-build-deps.py ]; then python3 build/install-build-deps.py --no-prompt --android || true
          elif [ -f build/install-build-deps.sh ]; then ./build/install-build-deps.sh --no-prompt --android || true
          fi
          git log -1 --oneline

      - name: Build the AAR
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euxo pipefail
          cd "$HOME/webrtc-checkout/src"
          if [ -n "${ARCH// /}" ]; then
            # shellcheck disable=SC2086
            ./tools_webrtc/android/build_aar.py --output ./libwebrtc.aar --arch $ARCH
          else
            ./tools_webrtc/android/build_aar.py --output ./libwebrtc.aar
          fi

      - name: Collect libwebrtc.aar
        run: |
          set -euo pipefail
          aar="$HOME/webrtc-checkout/src/libwebrtc.aar"
          if [ ! -f "$aar" ]; then echo "::error::libwebrtc.aar was not produced by the build."; exit 1; fi
          ls -lh "$aar"
          # Record the ABIs actually packaged, so consumers can check at a glance.
          unzip -l "$aar" | grep -E '\.so$' || true
          cp "$aar" "$GITHUB_WORKSPACE/libwebrtc.aar"

      - name: Upload libwebrtc.aar
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-android-m${{ steps.webrtc.outputs.milestone }}-${{ steps.webrtc.outputs.branch }}
          path: libwebrtc.aar
          if-no-files-found: error
          retention-days: 30
