# Builds the WebRTC dynamic library (webrtc.dll) for Windows.
#
# WebRTC only ships static libraries. The "Patch for a shared library" step below
# rewrites the build files so a component build is possible; see the wiki page
# "Shared library patch" for what each edit does and why.
#
# !!! IMPORTANT !!! Everything is kept on C:. The hosted runner's D: drive has
# roughly 14 GB free, and a WebRTC checkout does not come close to fitting.

name: WebRtcNativeWindowsDynamicLib

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: 'WebRTC branch-head to build, e.g. 7977. Leave empty for the latest stable Chromium milestone.'
        required: false
        default: ''
      target_cpu:
        description: 'Target CPU'
        required: false
        default: 'x64'
        type: choice
        options: ['x64', 'x86', 'arm64']

env:
  # Build with the Visual Studio installed on the runner rather than Google's
  # internal toolchain, which we have no access to.
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0
  GYP_GENERATORS: msvs-ninja,ninja
  GYP_MSVS_VERSION: 2022
  DEPOT_TOOLS_DIR: C:\depot_tools
  CHECKOUT_DIR: C:\webrtc-checkout

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Resolve WebRTC branch
        id: webrtc
        uses: ./.github/actions/resolve-webrtc-branch
        with:
          webrtc_branch: ${{ inputs.webrtc_branch }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -property installationPath
          if (-not $install) { throw 'vswhere could not find a Visual Studio installation.' }
          Write-Host "Visual Studio: $install"
          "GYP_MSVS_OVERRIDE_PATH=$install" | Out-File $env:GITHUB_ENV -Append
          "vs2022_install=$install"         | Out-File $env:GITHUB_ENV -Append

      - name: Install depot_tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DEPOT_TOOLS_DIR | Out-Null
          $zip = Join-Path $env:DEPOT_TOOLS_DIR 'depot_tools.zip'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/chrome-infra/depot_tools.zip' -OutFile $zip
          7z x -y "-o$env:DEPOT_TOOLS_DIR" $zip
          Remove-Item $zip
          # depot_tools must come first so its python and git win over the runner's.
          $env:DEPOT_TOOLS_DIR | Out-File $env:GITHUB_PATH -Append
          & (Join-Path $env:DEPOT_TOOLS_DIR 'gclient.bat')

      - name: Configure Git
        shell: pwsh
        run: |
          # gclient refuses to run without an identity; this is not a commit author.
          git config --global user.name  'github-actions'
          git config --global user.email 'github-actions@users.noreply.github.com'
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always

      - name: Fetch WebRTC source
        shell: pwsh
        env:
          BRANCH: ${{ steps.webrtc.outputs.branch }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:CHECKOUT_DIR | Out-Null
          Set-Location $env:CHECKOUT_DIR
          fetch --nohooks webrtc
          Set-Location (Join-Path $env:CHECKOUT_DIR 'src')
          $branch = $env:BRANCH
          git fetch origin ('+refs/branch-heads/{0}:refs/remotes/branch-heads/{0}' -f $branch)
          git checkout -B "webrtc-$branch" "refs/remotes/branch-heads/$branch"
          gclient sync -D --force --reset
          git log -1 --oneline

      - name: Patch for a shared library
        shell: pwsh
        run: |
          Set-Location (Join-Path $env:CHECKOUT_DIR 'src')

          # Each edit is asserted first. If upstream renames something, this fails
          # loudly here instead of quietly producing a static build an hour later.
          function Assert-Match($file, $pattern, $what) {
            if (-not (Select-String -Path $file -Pattern $pattern -SimpleMatch -Quiet)) {
              throw "Expected $what in $file. The shared-library patch needs updating for this WebRTC branch."
            }
          }

          Assert-Match 'BUILD.gn'           'rtc_static_library'                         'rtc_static_library'
          Assert-Match 'BUILD.gn'           'complete_static_lib'                        'complete_static_lib'
          Assert-Match 'webrtc.gni'         '!build_with_chromium && is_component_build' 'the component_build guard'
          Assert-Match 'rtc_tools\BUILD.gn' ':frame_analyzer'                            'the frame_analyzer dependency'

          # 1. emit shared libraries instead of static ones
          (Get-Content BUILD.gn).replace('rtc_static_library', 'rtc_shared_library') | Set-Content BUILD.gn
          # 2. complete_static_lib is meaningless for a shared library
          (Get-Content BUILD.gn) -notmatch 'complete_static_lib' | Set-Content BUILD.gn
          # 3. stop webrtc.gni suppressing the component build outside Chromium
          (Get-Content webrtc.gni).replace('!build_with_chromium && is_component_build', 'false') | Set-Content webrtc.gni
          # 4. frame_analyzer does not link under a component build
          (Get-Content rtc_tools\BUILD.gn) -notmatch ':frame_analyzer' | Set-Content rtc_tools\BUILD.gn

      - name: Build
        shell: pwsh
        env:
          TARGET_CPU: ${{ inputs.target_cpu || 'x64' }}
        run: |
          Set-Location (Join-Path $env:CHECKOUT_DIR 'src')
          $gnArgs = 'is_debug=false target_os="win" target_cpu="{0}" is_component_build=true ' +
                    'rtc_enable_symbol_export=true rtc_include_tests=false ' +
                    'rtc_build_tools=false rtc_build_examples=false'
          $gnArgs = $gnArgs -f $env:TARGET_CPU
          Write-Host "gn args: $gnArgs"
          gn gen out/Default --args="$gnArgs"
          # Name the target explicitly; the default builds the entire tree.
          autoninja -C out/Default webrtc

      - name: Collect webrtc.dll
        shell: pwsh
        run: |
          $out = Join-Path $env:CHECKOUT_DIR 'src\out\Default'
          $dll = Get-ChildItem -Path $out -Filter 'webrtc.dll' -Recurse | Select-Object -First 1
          if (-not $dll) { throw 'webrtc.dll was not produced by the build.' }
          Write-Host ('Found {0} ({1} MB)' -f $dll.FullName, [math]::Round($dll.Length / 1MB, 1))
          Copy-Item $dll.FullName (Join-Path $env:GITHUB_WORKSPACE 'webrtc.dll')

          # The import library is what a C/C++ caller links against.
          $imp = Get-ChildItem -Path $out -Filter 'webrtc.dll.lib' -Recurse | Select-Object -First 1
          if ($imp) { Copy-Item $imp.FullName (Join-Path $env:GITHUB_WORKSPACE 'webrtc.dll.lib') }

          # Symbols make crash dumps from P/Invoke callers readable.
          $pdb = Get-ChildItem -Path $out -Filter 'webrtc.dll.pdb' -Recurse | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName (Join-Path $env:GITHUB_WORKSPACE 'webrtc.dll.pdb') }

      - name: Upload webrtc.dll
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-windows-${{ inputs.target_cpu || 'x64' }}-dynamic-m${{ steps.webrtc.outputs.milestone }}-${{ steps.webrtc.outputs.branch }}
          path: |
            webrtc.dll
            webrtc.dll.lib
            webrtc.dll.pdb
          if-no-files-found: error
          retention-days: 30
