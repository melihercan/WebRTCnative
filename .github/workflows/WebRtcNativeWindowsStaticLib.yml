# Builds the WebRTC static library (webrtc.lib) for Windows.
#
# !!! IMPORTANT !!! Everything is kept on C:. The hosted runner's D: drive has
# roughly 14 GB free, and a WebRTC checkout does not come close to fitting.

name: WebRtcNativeWindowsStaticLib

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: 'WebRTC branch-head to build, e.g. 7977. Leave empty for the latest stable Chromium milestone.'
        required: false
        default: ''
      target_cpu:
        description: 'Target CPU'
        required: false
        default: 'x64'
        type: choice
        options: ['x64', 'x86', 'arm64']

env:
  # Build with the Visual Studio installed on the runner rather than Google's
  # internal toolchain, which we have no access to. This is the one switch that
  # matters; GYP_MSVS_VERSION and GYP_GENERATORS used to sit here too, but they
  # are GYP-era and vs_toolchain.py never reads them -- it detects the version
  # itself, which is why a stale "2022" here went unnoticed against a VS 18
  # runner.
  DEPOT_TOOLS_WIN_TOOLCHAIN: 0
  DEPOT_TOOLS_DIR: C:\depot_tools
  CHECKOUT_DIR: C:\webrtc-checkout

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Resolve WebRTC branch
        id: webrtc
        uses: ./.github/actions/resolve-webrtc-branch
        with:
          webrtc_branch: ${{ inputs.webrtc_branch }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -property installationPath
          $version = & $vswhere -latest -products * -property installationVersion
          if (-not $install) { throw 'vswhere could not find a Visual Studio installation.' }

          # Chromium's build/vs_toolchain.py identifies releases by year and
          # reads vs<year>_install. The runners now ship VS 18, which it calls
          # 2026, so the vs2022_install this step used to export was never read.
          # It also falls back to scanning %ProgramFiles%, so this is an
          # optimisation rather than a requirement: an unmapped version warns
          # instead of failing.
          $year = switch ([int]$version.Split('.')[0]) {
            18 { '2026' } 17 { '2022' } 16 { '2019' } default { '' }
          }
          Write-Host "Visual Studio $version at $install"
          "GYP_MSVS_OVERRIDE_PATH=$install" | Out-File $env:GITHUB_ENV -Append
          if ($year) {
            Write-Host "Exporting vs${year}_install"
            "vs${year}_install=$install" | Out-File $env:GITHUB_ENV -Append
          } else {
            Write-Host "::warning::Visual Studio $version has no known Chromium year mapping; relying on path detection."
          }

      - name: Install depot_tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DEPOT_TOOLS_DIR | Out-Null
          $zip = Join-Path $env:DEPOT_TOOLS_DIR 'depot_tools.zip'
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/chrome-infra/depot_tools.zip' -OutFile $zip
          7z x -y "-o$env:DEPOT_TOOLS_DIR" $zip
          Remove-Item $zip
          # depot_tools must come first so its python and git win over the runner's.
          $env:DEPOT_TOOLS_DIR | Out-File $env:GITHUB_PATH -Append
          & (Join-Path $env:DEPOT_TOOLS_DIR 'gclient.bat')

      - name: Configure Git
        shell: pwsh
        run: |
          # gclient refuses to run without an identity; this is not a commit author.
          git config --global user.name  'github-actions'
          git config --global user.email 'github-actions@users.noreply.github.com'
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always

      - name: Fetch WebRTC source
        shell: pwsh
        env:
          BRANCH: ${{ steps.webrtc.outputs.branch }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:CHECKOUT_DIR | Out-Null
          Set-Location $env:CHECKOUT_DIR
          fetch --nohooks webrtc
          Set-Location (Join-Path $env:CHECKOUT_DIR 'src')
          $branch = $env:BRANCH
          git fetch origin ('+refs/branch-heads/{0}:refs/remotes/branch-heads/{0}' -f $branch)
          git checkout -B "webrtc-$branch" "refs/remotes/branch-heads/$branch"
          gclient sync -D --force --reset
          git log -1 --oneline

      - name: Build
        shell: pwsh
        env:
          TARGET_CPU: ${{ inputs.target_cpu || 'x64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:CHECKOUT_DIR 'src')

          # The arguments go into args.gn rather than gn gen --args="...".
          # PowerShell strips the inner double quotes when passing a string to a
          # native command, so gn saw target_os=win instead of target_os="win"
          # and rejected it as an undefined identifier. Writing the file avoids
          # native-command quoting entirely.
          New-Item -ItemType Directory -Force -Path out/Default | Out-Null
          $gnArgs = @(
            'is_debug = false',
            'target_os = "win"',
            "target_cpu = `"$($env:TARGET_CPU)`"",
            # Tests, tools and examples never end up in webrtc.lib, so building
            # them would only cost time and the disk this runner does not have.
            'rtc_include_tests = false',
            'rtc_build_tools = false',
            'rtc_build_examples = false'
          )
          Set-Content -Path out/Default/args.gn -Value $gnArgs -Encoding utf8
          Write-Host '--- args.gn ---'
          Get-Content out/Default/args.gn

          # pwsh does not fail a step when a native command exits non-zero, so
          # check explicitly. Without this a gn failure was reported later as a
          # confusing "build.ninja not found" from ninja.
          gn gen out/Default
          if ($LASTEXITCODE -ne 0) { throw "gn gen failed with exit code $LASTEXITCODE" }

          # Name the target explicitly; the default builds the entire tree.
          autoninja -C out/Default webrtc
          if ($LASTEXITCODE -ne 0) { throw "autoninja failed with exit code $LASTEXITCODE" }

      - name: Collect webrtc.lib
        shell: pwsh
        run: |
          $out = Join-Path $env:CHECKOUT_DIR 'src\out\Default'
          $lib = Get-ChildItem -Path $out -Filter 'webrtc.lib' -Recurse | Select-Object -First 1
          if (-not $lib) { throw 'webrtc.lib was not produced by the build.' }
          Write-Host ('Found {0} ({1} MB)' -f $lib.FullName, [math]::Round($lib.Length / 1MB, 1))
          Copy-Item $lib.FullName (Join-Path $env:GITHUB_WORKSPACE 'webrtc.lib')

      - name: Upload webrtc.lib
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-windows-${{ inputs.target_cpu || 'x64' }}-static-m${{ steps.webrtc.outputs.milestone }}-${{ steps.webrtc.outputs.branch }}
          path: webrtc.lib
          if-no-files-found: error
          retention-days: 30
