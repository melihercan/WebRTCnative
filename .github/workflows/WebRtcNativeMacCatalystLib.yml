# Builds WebRTC.xcframework for the MAUI Mac Catalyst binding
# (net10.0-maccatalyst).
#
# Catalyst is an iOS app running on a Mac, so this is the iOS toolchain with a
# different arch list -- webrtc_ios is fetched and build_ios_libs.py does the
# work, exactly as for iOS. Upstream's default arch list omits the catalyst
# slices entirely, which is why they are named explicitly here.
#
# Run this and WebRtcNativeIosLib against the same webrtc_branch when
# refreshing Apple support, or the two can land on different milestones.

name: WebRtcNativeMacCatalystLib

on:
  workflow_dispatch:
    inputs:
      webrtc_branch:
        description: 'WebRTC branch-head to build, e.g. 7977. Leave empty for the latest stable Chromium milestone.'
        required: false
        default: ''
      arch:
        description: 'Slices to build, space separated.'
        required: false
        default: 'catalyst:arm64 catalyst:x64'
      build_config:
        description: 'Build configuration'
        required: false
        default: 'release'
        type: choice
        options: ['release', 'debug']

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Resolve WebRTC branch
        id: webrtc
        uses: ./.github/actions/resolve-webrtc-branch
        with:
          webrtc_branch: ${{ inputs.webrtc_branch }}

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          # depot_tools must come first so its python and git win over the runner's.
          echo "${GITHUB_WORKSPACE}/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap gclient
        run: gclient

      - name: Configure Git
        run: |
          # gclient refuses to run without an identity; this is not a commit author.
          git config --global user.name  'github-actions'
          git config --global user.email 'github-actions@users.noreply.github.com'
          git config --global core.autocrlf false
          git config --global core.filemode false
          git config --global branch.autosetuprebase always

      - name: Fetch WebRTC source
        env:
          BRANCH: ${{ steps.webrtc.outputs.branch }}
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/webrtc-checkout"
          cd "$HOME/webrtc-checkout"
          # webrtc_ios pulls the deps build_ios_libs.py needs; Catalyst is
          # built from the same solution as iOS.
          fetch --nohooks webrtc_ios
          cd src
          git fetch origin "+refs/branch-heads/${BRANCH}:refs/remotes/branch-heads/${BRANCH}"
          git checkout -B "webrtc-${BRANCH}" "refs/remotes/branch-heads/${BRANCH}"
          gclient sync -D --force --reset
          git log -1 --oneline

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
          uname -m

      - name: Build the xcframework
        env:
          ARCH: ${{ inputs.arch }}
          BUILD_CONFIG: ${{ inputs.build_config || 'release' }}
        run: |
          set -euxo pipefail
          cd "$HOME/webrtc-checkout/src"
          # shellcheck disable=SC2086
          ./tools_webrtc/ios/build_ios_libs.py \
            --build_config "${BUILD_CONFIG}" \
            --arch ${ARCH}
          ls -l out_ios_libs

      - name: Package the xcframework
        run: |
          set -euo pipefail
          cd "$HOME/webrtc-checkout/src"
          framework='out_ios_libs/WebRTC.xcframework'
          if [ ! -d "$framework" ]; then
            echo "::error::WebRTC.xcframework was not produced by the build."
            exit 1
          fi
          # List the slices so the log records what actually went in.
          ls -1 "$framework"
          # Zip from inside out_ios_libs so the archive holds WebRTC.xcframework
          # at its root, and use -y to keep the framework's symlinks intact --
          # upload-artifact would otherwise dereference and corrupt the bundle.
          cd out_ios_libs
          zip -qry "$GITHUB_WORKSPACE/WebRTC.xcframework.zip" WebRTC.xcframework -x '*.DS_Store'
          ls -lh "$GITHUB_WORKSPACE/WebRTC.xcframework.zip"

      - name: Upload the xcframework
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-maccatalyst-m${{ steps.webrtc.outputs.milestone }}-${{ steps.webrtc.outputs.branch }}
          path: WebRTC.xcframework.zip
          if-no-files-found: error
          retention-days: 30
          # The zip is already compressed; recompressing it only wastes time.
          compression-level: 0
